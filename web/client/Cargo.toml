# The browser client is an application, so unlike the portable library crates
# it uses `std` and the allocator freely. Deliberately its own workspace: it
# targets `wasm32-unknown-unknown` and pulls in dependencies (russh, smoltcp,
# wasm-bindgen) that the no_std crates must never see.
[workspace]
resolver = "3"

[package]
edition      = "2024"
name         = "tailfeather-web"
description  = "Browser Tailscale node and SSH terminal built on tailfeather"
license      = "MIT OR Apache-2.0"
rust-version = "1.88"
version      = "0.0.1"
publish      = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tailfeather = { path = "../../crates/tailfeather", features = ["peer-names"] }
heapless = "0.9"
embedded-io-async = "0.7"

base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

smoltcp = { version = "0.13", default-features = false, features = [
  "alloc",
  "async",
  "medium-ip",
  "proto-ipv4",
  "socket-tcp",
] }
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "BinaryType",
  "CloseEvent",
  "Crypto",
  "Event",
  "MessageEvent",
  "Performance",
  "Response",
  "Storage",
  "WebSocket",
  "Window",
  "console",
] }

# ring (under russh) still draws randomness through getrandom 0.2, whose
# browser backend is a feature rather than a cfg.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3

[patch.crates-io]
micro-h2 = { path = "../../crates/micro-h2" }
tailfeather = { path = "../../crates/tailfeather" }
wirefeather = { path = "../../crates/wirefeather" }
