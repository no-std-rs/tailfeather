[workspace]
resolver = "3"

[package]
name = "tailfeather-reactor"
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false
description = "Shared asynchronous runtime for Tailfeather nodes"

[features]
default = []
alloc = ["smoltcp/alloc"]
fast-curve25519 = ["tailfeather/fast-curve25519"]
peer-names = ["tailfeather/peer-names"]
hosted-policy = ["tailfeather/hosted-policy"]
accelerated-crypto = ["tailfeather/accelerated-crypto"]
std = ["alloc", "dep:tokio", "dep:tokio-rustls", "dep:webpki-roots", "dep:getrandom", "dep:tempfile", "critical-section/std", "embedded-io-async/std", "dep:rustix"]
tls = ["dep:embedded-tls"]
embassy = ["dep:embassy-time", "dep:embassy-net", "tls", "dep:rand_core"]

[dependencies]
tailfeather = { path = "../tailfeather", default-features = false }
smoltcp = { version = "0.13.1", default-features = false, features = ["async", "medium-ip", "proto-ipv4", "socket-tcp"] }
heapless = "0.9"
embedded-io-async = { version = "0.7", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-time = { version = "0.5", default-features = false, optional = true }
embassy-net = { version = "0.9.1", default-features = false, features = ["dns", "tcp", "udp", "proto-ipv4", "medium-ip"], optional = true }
embedded-tls = { git = "https://github.com/pawelchcki/embedded-tls", rev = "48fef49e6e7cbdaa44e9003a45078656f8955d3d", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
tokio = { version = "1", optional = true, features = ["rt", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
getrandom = { version = "0.3", optional = true }
tempfile = { version = "3", optional = true }
critical-section = { version = "1.2", default-features = false }
zeroize = { version = "1.8", default-features = false }
pin-project-lite = "0.2"
embassy-futures = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs"], optional = true }

[dev-dependencies]
serde_json = "1"
embassy-time = { version = "0.5", features = ["std", "generic-queue-64"] }
critical-section = { version = "1.2", features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[[example]]
name = "headscale"
required-features = ["std"]

[[bench]]
name = "throughput"
harness = false
required-features = ["embassy"]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[patch.crates-io]
wirefeather = { path = "../wirefeather" }

[[example]]
name = "cpu"
required-features = ["std"]
