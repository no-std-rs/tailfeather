[package]
name        = "wirefeather"
version     = "0.0.1"
edition     = "2024"
rust-version = "1.88"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/no-std-rs/tailfeather"
publish     = false
description = "Sans-io, no_std, allocation-free WireGuard protocol core"
readme      = "README.md"
keywords    = ["wireguard", "vpn", "no-std", "embedded", "sans-io"]
categories  = ["network-programming", "no-std", "cryptography"]

[dependencies]
blake2            = { version = "0.10", default-features = false }
chacha20poly1305  = { version = "0.10", default-features = false }
heapless          = "0.9"
hmac              = { version = "0.12", default-features = false }
subtle            = { version = "2.6", default-features = false }
x25519-dalek      = { version = "2", default-features = false, features = ["static_secrets", "precomputed-tables", "zeroize"] }
zeroize           = { version = "1.8", default-features = false }

[dev-dependencies]
hex = "0.4"
