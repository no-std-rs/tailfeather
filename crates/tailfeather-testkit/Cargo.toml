[package]
name = "tailfeather-testkit"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pawelchcki/tailfeather"
publish = false
description = "Portable offline vectors, replay checks, and reports for tailfeather"
readme = "README.md"
keywords = ["tailscale", "testing", "conformance"]
categories = ["development-tools::testing", "network-programming"]

[lib]
name = "tailfeather_testkit"

[[bin]]
name = "tailfeather-testkit"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tailfeather = { path = "../tailfeather", version = "0.0.1" }
