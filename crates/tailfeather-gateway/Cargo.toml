[package]
name = "tailfeather-gateway"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = ["crates-io", "runnerless-capture"]

description = "Allocation-free no_std IPv4 routing, NAT, and peer API for Tailfeather gateways"
repository = "https://github.com/no-std-rs/tailfeather"
readme = "README.md"
keywords = ["tailscale", "nat", "no-std", "embedded"]
categories = ["network-programming", "no-std", "embedded"]

[features]
default = []
# Taildrop file receive and send over caller-supplied byte streams, with
# blocking (embedded-io) and async (embedded-io-async) drivers. The sans-I/O
# HTTP framing they share, and the packet-level DNS peer API, are always built.
taildrop = ["dep:embedded-io", "dep:embedded-io-async"]
# Heap-backed conveniences (an in-memory Taildrop sink). Allocation is
# fallible; the default build stays allocation-free.
alloc = []

[dependencies]
embedded-io = { version = "0.7", default-features = false, optional = true }
embedded-io-async = { version = "0.7", default-features = false, optional = true }
wirefeather = { path = "../wirefeather", version = "0.0.1" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util"] }

[package.metadata.docs.rs]
all-features = true
