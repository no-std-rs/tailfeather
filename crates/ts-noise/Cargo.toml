[package]
name        = "ts-noise"
description = "The Tailscale ts2021 control-plane transport: Noise IK over TCP, controlbase framing, and the HTTP/1.1 upgrade that starts it"
readme      = "README.md"
keywords    = ["tailscale", "noise", "no-std", "embedded", "sans-io"]
categories  = ["network-programming", "no-std", "cryptography"]

edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[dependencies]
ts-keys.workspace      = true
wg-core.workspace      = true
x25519-dalek.workspace = true
zeroize.workspace      = true

[dev-dependencies]
# The KAT in tests/kat.rs reads tests/vectors/noise-ik.json. Dev-dependencies
# are not compiled into the library, so this does not reach the firmware and
# the crate stays no_std and allocation-free where it counts.
hex        = "0.4"
serde_json = "1"
# The KAT needs to build keys from the vector bytes.
x25519-dalek.workspace = true
