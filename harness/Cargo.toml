# Its own workspace: `.cargo/config.toml` here pins
# `x86_64-unknown-linux-none` and enables `build-std`, which cargo would
# otherwise apply to the whole tree and break host-side tests.
[workspace]
resolver = "3"

[package]
name    = "harness"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.0.1"
publish = false

[dependencies]
# Already in the tree via wirefeather; named here because the reactor's fixed
# descriptor table is the harness's own, not something a library hands it.
heapless = "0.9"
critical-section = "1.2"

# The Linux syscall interface. With default features off it compiles for
# `x86_64-unknown-linux-none` with no libc, no `std` and no allocator — the same
# instructions hand-written `asm!` would emit, but checked, so every module
# above `rt` is free of `unsafe`.
rustix = { version = "1", default-features = false, features = ["event", "fs", "net", "rand", "time"] }

micro-h2   = "=0.2.0"
tailfeather = { path = "../crates/tailfeather" }
tailfeather-gateway = { path = "../crates/tailfeather-gateway" }
# TLS 1.3; tailfeather supplies the bounded ECDSA/RSA path verifier. The
# upstream `rsa` feature remains disabled because it enables `alloc`.
embedded-tls       = { git = "https://github.com/pawelchcki/embedded-tls", rev = "f1fdbf1e49a3c109063384d5ee669e190f08ff58", default-features = false }
embedded-io-async  = "0.7"
p256               = { version = "0.13", default-features = false, features = ["ecdsa"] }
rand_core          = { version = "0.6.3", default-features = false }

wirefeather    = { path = "../crates/wirefeather" }

# Named directly because `control.rs` builds the ephemeral key for the ts2021
# handshake; every other use of it is behind tailfeather::keys or wirefeather.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "precomputed-tables", "zeroize"] }

# There is no unwinder on a target with no libc, and nothing to unwind into.
[profile.dev]
panic     = "abort"
opt-level = 1

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"

# ChaCha20-Poly1305 is unusably slow unoptimised, and the harness is expected to
# carry real traffic.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
tailfeather = { path = "../crates/tailfeather" }
wirefeather = { path = "../crates/wirefeather" }
