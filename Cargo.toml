# Root workspace dependency metadata for the portable library crates.
#
# `firmware/` and `harness/` are deliberately NOT members. Bazel resolves them
# as independent Cargo metadata closures for their distinct target platforms.
[workspace]
exclude  = ["firmware", "harness", "web"]
members  = [
  "crates/tailfeather",
  "crates/tailfeather-gateway",
  "crates/tailfeather-testkit",
  "crates/ts-conformance",
  "crates/wirefeather",
]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/no-std-rs/tailfeather"
rust-version = "1.88"

[workspace.dependencies]
# --- crypto (all no_std, no-alloc) ---
blake2            = { version = "0.10", default-features = false }
chacha20poly1305  = { version = "0.10", default-features = false }
hmac              = { version = "0.12", default-features = false }
subtle            = { version = "2.6", default-features = false }
x25519-dalek      = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize           = { version = "1.8", default-features = false }

# --- structure ---
heapless = "0.9"

# --- HTTP/2 ---
micro-h2 = "=0.2.0"

# --- internal ---
tailfeather = { path = "crates/tailfeather", version = "0.0.1" }
tailfeather-gateway = { path = "crates/tailfeather-gateway", version = "0.0.1" }
wirefeather = { path = "crates/wirefeather", version = "0.0.1" }

# ChaCha20-Poly1305 is the throughput bottleneck of the whole tunnel and is
# unusably slow when compiled without optimization, so optimize dependencies
# even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3

[patch.crates-io]
tailfeather = { path = "crates/tailfeather" }
wirefeather = { path = "crates/wirefeather" }
