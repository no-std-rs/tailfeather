[workspace]
resolver = "3"

[package]
name = "tailfeather-hosted"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tailfeather = { path = "../crates/tailfeather", features = ["peer-names", "hosted-policy"] }
wirefeather = { path = "../crates/wirefeather" }
critical-section = { version = "1.2", features = ["std"] }
embedded-io-async = { version = "0.7", features = ["std"] }
heapless = "0.9"
getrandom = "0.3"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
smoltcp = { version = "0.13", default-features = false, features = ["alloc", "async", "medium-ip", "proto-ipv4", "socket-tcp"] }
tempfile = "3"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
serde_json = "1"
tracing-subscriber = "0.3"
