# Headscale configuration for the conformance lab.
#
# Deliberately minimal: this exists to be a protocol reference, not a
# production deployment. Anything that would make the control plane easier on
# us but is not what a real server does has to stay off, or the lab stops
# proving compatibility.

server_url: http://127.0.0.1:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

noise:
  private_key_path: /tmp/tailfeather-lab/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

database:
  type: sqlite
  sqlite:
    path: /tmp/tailfeather-lab/headscale/db.sqlite

# Headscale refuses to start with an empty DERP map, and running its embedded
# relay is better than pointing at Tailscale's anyway: the lab stays offline and
# reproducible, and we get a real DERP endpoint to test relay support against
# when that work arrives. A client must be able to parse this map whether or not
# it ever relays through it.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: lab
    region_name: Conformance Lab
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /tmp/tailfeather-lab/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

dns:
  magic_dns: true
  base_domain: lab.internal
  nameservers:
    global:
      - 1.1.1.1
  search_domains: []

log:
  level: debug
  format: text

policy:
  mode: database
