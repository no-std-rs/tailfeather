name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: validate Conventional Commit title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([[:alnum:]_.-]+\))?(!)?: .+$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "valid Conventional Commit title: $PR_TITLE"
            exit 0
          fi

          echo "::error title=Invalid pull request title::Use a Conventional Commit title such as 'feat: add node roaming' or 'fix(release): preserve dependency order'."
          exit 1
