name: ESP32-C6 emulator

on:
  pull_request:
  push:
    branches: [main]
    paths: ['firmware/**', 'crates/tailfeather/**', 'crates/tailfeather-gateway/**', 'crates/wirefeather/**', 'bazel/**', 'platforms/**', 'MODULE.bazel*', 'Cargo.*', 'BUILD.bazel', '.bazel*', 'scripts/esp-emulator-smoke.py', '.github/workflows/esp-emulator.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.files.outputs.relevant }}
    steps:
      # Path filtering happens here rather than in `on:` so that a pull
      # request touching nothing relevant skips the jobs below, which
      # satisfies required checks, instead of never starting them, which
      # leaves required checks pending forever.
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Run under `bash -e`: a failed API call (including a later page)
          # fails this job, which fails the summary check, rather than
          # reading as "nothing relevant changed".
          relevant=true
          if [ "$EVENT" = pull_request ]; then
            count=$(gh api "repos/$REPO/pulls/$PR" --jq .changed_files)
            # The files endpoint stops at 3000; past that, assume relevant.
            if [ "$count" -lt 3000 ]; then
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
              if ! grep -Eq '^(firmware/|crates/tailfeather/|crates/tailfeather-gateway/|crates/wirefeather/|bazel/|platforms/|MODULE\.bazel[^/]*$|Cargo\.[^/]*$|BUILD\.bazel$|\.bazel[^/]*$|scripts/esp-emulator-smoke\.py$|\.github/workflows/esp-emulator\.yml$)' <<<"$files"; then
                relevant=false
              fi
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
  firmware-smoke:
    name: ESP32-C6 firmware smoke
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Download checksum-pinned emulator and image converter
        run: |
          mkdir -p "$RUNNER_TEMP/esp-tools"
          cd "$RUNNER_TEMP/esp-tools"
          curl --fail --location --retry 3 --output emulator.tar.gz https://github.com/espressif/esp-emulator/releases/download/v0.50.0/esp-emu-0.50.0-x86_64-unknown-linux-gnu.tar.gz
          echo '3f388f44ae38e829c74d637a68f4d80a136c375ff4d7d168acf87c8d274f0075  emulator.tar.gz' | sha256sum --check
          tar -xzf emulator.tar.gz
          curl --fail --location --retry 3 --output espflash.zip https://github.com/esp-rs/espflash/releases/download/v4.4.0/espflash-x86_64-unknown-linux-gnu.zip
          echo 'ac2031bd1f04c9107d9ba0e977535daa885a9f533f937dc369debd77f83665cd  espflash.zip' | sha256sum --check
          unzip espflash.zip
          chmod +x espflash
          echo "$RUNNER_TEMP/esp-tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/esp-tools/esp-emu-0.50.0-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Build real firmware with inert CI provisioning
        run: bazel build --noannounce_rc --config=local --config=optimized //firmware:ci_image
      - name: Exercise boot, Wi-Fi, IPv6 SLAAC, persistence, and interrupted first write
        run: python3 scripts/esp-emulator-smoke.py --elf bazel-bin/firmware/esp_gateway_firmware --require-ipv6 --logs-dir "$RUNNER_TEMP/esp-emulator-logs"
      - name: Retain emulator console diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp-emulator-logs
          path: ${{ runner.temp }}/esp-emulator-logs/
          if-no-files-found: ignore
          retention-days: 7
  # The check to require. Skipped jobs pass required checks, so a failed
  # `changes` job must surface here rather than skip the smoke test.
  result:
    name: ESP32-C6 emulator
    needs: [changes, firmware-smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "an emulator job ended: $result"; exit 1;; esac
          done
