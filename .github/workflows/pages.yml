name: Publish web client

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  # A newer PR build must not interrupt a publisher while it replaces assets.
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'tailfeather-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Prepare web build identity
        id: identity
        run: |
          args=(--web-channel main --commit "$SOURCE_COMMIT")
          if [[ "$GITHUB_REF" == refs/tags/tailfeather-v* ]]; then
            args=(--web-channel stable --commit "$SOURCE_COMMIT" --tag "$GITHUB_REF_NAME")
          fi
          python3 scripts/prepare-release.py "${args[@]}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/client/package-lock.json
      - name: Install Rust and WebAssembly target
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            web/client/target
            web/client/.tools
          key: ${{ runner.os }}-web-rust-1.95.0-${{ hashFiles('web/client/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-web-rust-1.95.0-
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm
      - name: Build static client
        working-directory: web/client
        run: |
          npm ci --no-audit --no-fund
          npm run test:links
          npm run test:labels
          ./build.sh --static
      - name: Test browser client and Pages path
        working-directory: web/client
        run: |
          npx --no-install playwright-core install --with-deps chromium
          npm run test:e2e -- --local
          npm run test:pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-client
          path: web/dist
          include-hidden-files: true
          retention-days: 3

  stable_assets:
    needs: build
    if: >-
      needs.build.outputs.channel == 'stable' &&
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/tailfeather-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-client
          path: incoming
      - name: Attach immutable web assets to the Tailfeather release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
        run: python3 scripts/web-release.py stable-assets incoming

  deploy:
    needs: [build, stable_assets]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.stable_assets.result == 'success' || needs.stable_assets.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/tailfeather-v'))) ||
       (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/tailfeather-v')) ||
       (github.event_name == 'pull_request' && github.event.pull_request.user.id == 317265358 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'release-please--branches--main--tracks--tailfeather'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: github-pages-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-client
          path: incoming
      - name: Publish rolling preview and compose stable + main Pages
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/web-release.py publish incoming site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 900000
