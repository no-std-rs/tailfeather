name: Publish web client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/client/package-lock.json
      - name: Install Rust and WebAssembly target
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            web/client/target
            web/client/.tools
          key: ${{ runner.os }}-web-rust-1.95.0-${{ hashFiles('web/client/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-web-rust-1.95.0-
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm
      - name: Build static client
        working-directory: web/client
        run: |
          npm ci --no-audit --no-fund
          npm run test:links
          ./build.sh --static
      - name: Test browser client and Pages path
        working-directory: web/client
        run: |
          npx --no-install playwright-core install --with-deps chromium
          npm run test:e2e -- --local
          npm run test:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
