name: Privileged lab

# Runs for release pull requests (Runnerless/release-please branches), nightly
# on main, and on demand. Elsewhere the job is skipped, which a required check
# accepts, so requiring it gates releases without blocking feature PRs. The
# nightly run finds a regression within a day of the commit that caused it
# rather than at release time; the faster NAT matrix (nat-matrix.yml) runs on
# every relevant pull request.
on:
  pull_request:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privileged-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privileged-lab:
    name: Privileged lab
    # Same-repository release branches only: a fork can name its branch
    # anything.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Enable KVM access on the disposable hosted VM
        run: |
          test -c /dev/kvm
          test -c /dev/net/tun
          sudo chmod a+rw /dev/kvm /dev/net/tun
      - name: Run the complete privileged lab locally
        run: >-
          bazel test --config=local --config=optimized
          --strategy=TestRunner=local --test_output=all
          //:privileged_lab
      - name: Retain lab diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: privileged-lab-logs
          path: bazel-testlogs/tests/lab/privileged_lab/
          if-no-files-found: ignore
          retention-days: 7
